name: CML Report - Food Delivery Prediction

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Allow posting comments on PR's
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest

    steps:
      #1 Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python setup
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # 3. Set up CML
      - name: Setup CML
        uses: iterative/setup-cml@v2
        with:
          vega: false

      # 4. Install project dependencies
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install --upgrade pip
          uv pip install -e .

      # 5. Google Cloud Authentication
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # 6. Data processing
      - name: Process data
        run: |
          source .venv/bin/activate
          python -m food_on_the_fly.data.temporal_split

      # 7. Training the model (Speed)
      - name: Train model and generate visualizations
        env:
          MLFLOW_ALLOW_FILE_STORE: true
        run: |
          source .venv/bin/activate
          python -m food_on_the_fly.train_model model=xgboost_baseline

      # 8a. Downloads artifacts
      - name: Upload CML plots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cml-plots
          path: |
            prediction_scatter.png
            residual_plot.png
            error_distribution.png
            feature_importance.png
            metrics.txt

      # 8b. Generates Reports (CML) on PRs
      - name: Create CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .venv/bin/activate

          # Build the report
          echo "## 🚀 Food Delivery Time Prediction - Model Report" >> report.md
          echo "" >> report.md
          echo "**Model**: XGBoost Baseline (50 trees, depth=3)" >> report.md
          echo "**Commit**: \`${GITHUB_SHA:0:7}\`" >> report.md
          echo "**Branch**: \`${GITHUB_HEAD_REF}\`" >> report.md
          echo "" >> report.md

          # Add metrics
          echo "### 📊 Performance Metrics" >> report.md
          echo '```' >> report.md
          cat metrics.txt >> report.md
          echo '```' >> report.md
          echo "" >> report.md

          # Add model comparison vs. baseline
          python scripts/compare_to_baseline.py
          cat comparison.md >> report.md
          echo "" >> report.md

          # Plots: CML's image host (cml comment --publish) now returns
          # HTTP 500, so the plots are linked as a run artifact instead.
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "### 📈 Visualizations" >> report.md
          echo "" >> report.md
          echo "Prediction vs actual, residuals, error distribution and feature importance are attached to [this workflow run](${RUN_URL}) as the \`cml-plots\` artifact." >> report.md
          echo "" >> report.md
          echo "---" >> report.md
          echo "*Generated automatically by CML*" >> report.md

          # Post the report
          cml comment create report.md
